name: Refresh profile

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public data and generate SVGs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/profile.py --refresh
      - name: Validate renderer
        run: python -m unittest discover -s tests
      - name: Commit refreshed profile
        run: |
          git add README.md data/profile.json assets/terminal.svg assets/terminal-mobile.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile telemetry'
          git push
